services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barterswap
      POSTGRES_PASSWORD: barterswap
      POSTGRES_DB: barterswap
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barterswap -d barterswap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://barterswap:barterswap@db:5432/barterswap?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
